# Clippy configuration for kubegen
# See https://doc.rust-lang.org/clippy/configuration.html for all options

# Warn on missing documentation for public items
warn-on-all-wildcard-imports = true

# Maximum allowed cognitive complexity for functions
cognitive-complexity-threshold = 30

# Minimum number of lines for a function to be considered too long
too-many-lines-threshold = 150

# Maximum allowed type complexity
type-complexity-threshold = 500

# Maximum number of arguments for a function
too-many-arguments-threshold = 7

# Maximum size for large error types
large-error-threshold = 128
